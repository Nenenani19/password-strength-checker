<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Strength Checker</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .strength {
      margin-top: 15px;
      font-weight: bold;
    }

    .progress-bar {
      height: 8px;
      background: #334155;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }

    ul {
      text-align: left;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Password Checker</h2>

  <input type="password" id="password" placeholder="Enter password" oninput="checkPassword()">

  <button onclick="togglePassword()">Show / Hide</button>

  <div class="progress-bar">
    <div id="progress" class="progress"></div>
  </div>

  <div id="result" class="strength"></div>
  <ul id="suggestions"></ul>
</div>

<script>

function togglePassword() {
  let input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}

function checkPassword() {
  let password = document.getElementById("password").value;
  let score = 0;
  let suggestions = [];

  if (password.length >= 8) score++;
  else suggestions.push("At least 8 characters");

  if (/[A-Z]/.test(password)) score++;
  else suggestions.push("Add uppercase letter");

  if (/[a-z]/.test(password)) score++;
  else suggestions.push("Add lowercase letter");

  if (/[0-9]/.test(password)) score++;
  else suggestions.push("Add number");

  if (/[@#$%^&+=!]/.test(password)) score++;
  else suggestions.push("Add special character");

  let result = document.getElementById("result");
  let suggestionList = document.getElementById("suggestions");
  let progress = document.getElementById("progress");

  suggestionList.innerHTML = "";

  // Progress Bar Logic
  let percent = (score / 5) * 100;
  progress.style.width = percent + "%";

  if (score <= 2) {
    result.textContent = "Weak Password";
    progress.style.background = "red";
  } else if (score <= 4) {
    result.textContent = "Medium Password";
    progress.style.background = "orange";
  } else {
    result.textContent = "Strong Password";
    progress.style.background = "green";
  }

  suggestions.forEach(s => {
    let li = document.createElement("li");
    li.textContent = s;
    suggestionList.appendChild(li);
  });
}

</script>

</body>
</html>
